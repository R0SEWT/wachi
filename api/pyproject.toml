[project]
name = "wachi"
version = "2.0.0"
description = "Rutas a pie Rápida y Tranquila para Lima, sobre robos registrados a 150 m"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "numpy>=1.26",
  "scipy>=1.13",
  "shapely>=2.0",
  "pyproj>=3.6",
  "h3>=4.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "osmium>=4.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wachi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: necesita api/data/ con el pbf y eventos reales"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 110
target-version = "py312"
