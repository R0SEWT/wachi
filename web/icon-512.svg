<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#0e1117"/>
  <!-- Círculo concéntrico sutil de radar / seguridad -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1f2937" stroke-width="8" stroke-dasharray="16 16"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.3"/>
  <!-- Trazo peatonal seguro con forma de W / ruta -->
  <path d="M140 180 L200 340 L256 220 L312 340 L372 180" 
        fill="none" 
        stroke="#22c55e" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <!-- Puntos GPS de origen y destino -->
  <circle cx="140" cy="180" r="22" fill="#3b82f6" stroke="#ffffff" stroke-width="8"/>
  <circle cx="372" cy="180" r="24" fill="#22c55e" stroke="#ffffff" stroke-width="8"/>
</svg>
