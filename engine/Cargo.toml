[package]
name = "wachi-engine"
version = "3.0.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Motor de rutas de Wachi (Rápida/Tranquila) en Rust: mismo contrato que api/ (FastAPI)"
license = "MIT"
publish = false

[[bin]]
name = "wachi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow = { version = "60", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
dotenvy = "0.15"
geo = "0.33"
h3o = "0.11"
osmpbf = "0.3"
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "flate2", "flate2-rust_backend"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tower = { version = "0.5", features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4
debug = 1
